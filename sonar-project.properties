cat > sonar-project.properties <<'EOF'
sonar.projectKey=student-management-api
sonar.projectName=Student Management API
sonar.projectVersion=1.0

sonar.sources=app
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.exclusions=**/__pycache__/**,**/*.pyc,.venv/**,dist/**,.pytest_cache/**
EOF
